# Full-history secret scan.
#
# Runs on every push and pull request. This repo is public: minutes are free,
# there are outside contributors, and a secret that reaches a public branch is
# public the moment it lands — reporting it late is still worth far more than
# not reporting it.
#
# The pre-push hook is still the better guard, because it stops a secret before
# it travels. This is the backstop for anyone who has not installed it.
#
# The gitleaks binary, not gitleaks-action. The action refuses to run for an
# organisation without a paid licence key; the scanner itself is free and does
# the same job. Pinned to an exact version and checksum-free by virtue of the
# tag, so an upgrade is a visible edit rather than a silent one.
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # scan the whole history, not just the diff

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
