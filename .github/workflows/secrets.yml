# Full-history secret scan.
#
# Runs on every push and pull request. This repo is public: minutes are free,
# there are outside contributors, and a secret that reaches a public branch is
# public the moment it lands — reporting it late is still worth far more than
# not reporting it.
#
# The pre-push hook is still the better guard, because it stops a secret before
# it travels. This is the backstop for anyone who has not installed it.
name: secrets
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # scan the whole history, not just the diff
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
